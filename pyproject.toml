[project]
name = "pc-agent"
version = "0.1.0"
description = "Bedrock: a lightweight multi-agent personal computer task agent"
readme = "README.md"
authors = [
    { name = "Rudra Prasad", email = "rudraprasad.email@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "groq>=1.7.0",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[project.scripts]
pc-agent = "pc_agent.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
